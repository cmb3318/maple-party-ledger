<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11121a" />
    <meta
      name="description"
      content="메이플스토리 캐릭터별 보스 파티 배정과 결정석 수입 관리"
    />
    <title>단풍수첩 · 보스 파티와 결정석</title>
    <link rel="icon" href="/leaf.png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="shell mast">
        <a class="brand" href="/"
          ><img src="/leaf.png" alt="" width="28" height="28" />단풍수첩</a
        >
        <span id="week" class="muted week-label"></span>
      </div>
    </header>
    <main class="shell">
      <div class="heading">
        <h1>보스 파티</h1>
        <div class="tools">
          <button id="addSquad">+ 파티 추가</button>
          <button id="addCharacter" class="primary">+ 캐릭터 추가</button>
        </div>
      </div>
      <section class="earnings" aria-label="결정석 수입" aria-live="polite">
        <div>
          <span>주간 예상</span><strong id="weeklyTotal"></strong
          ><small id="weeklyCount"></small>
        </div>
        <div>
          <span>주간 격파</span><strong id="weeklyDone"></strong
          ><small id="weeklyCleared"></small>
        </div>
        <div>
          <span>월간 예상</span><strong id="monthlyTotal"></strong
          ><small id="monthlyCleared"></small>
        </div>
      </section>
      <p class="notice" id="cap" hidden></p>
      <div class="toolbar">
        <nav id="modes" aria-label="보기 방식">
          <button data-mode="characters" aria-pressed="true">
            캐릭터별 보기
          </button>
          <button data-mode="squads" aria-pressed="false">파티별 보기</button>
          <button data-mode="bosses" aria-pressed="false">보스별 보기</button>
        </nav>
        <div class="tools">
          <button id="openBulk" class="primary">보스 일괄 편집</button
          ><button id="showPrices">결정석 가격표</button>
        </div>
      </div>
      <section class="finder" aria-label="보스 목록 필터">
        <div class="finder-controls">
          <input
            type="search"
            id="boardSearch"
            placeholder="캐릭터, 보스, 파티 검색"
            aria-label="캐릭터, 보스, 파티 검색"
            autocomplete="off"
          />
          <label class="hide-done"
            ><input type="checkbox" id="hideDone" />격파 숨기기</label
          >
          <button type="button" id="foldCards" aria-pressed="false">
            모두 접기
          </button>
          <span id="boardCount" class="muted" aria-live="polite"></span>
        </div>
        <div
          id="partyFilters"
          class="party-filters"
          aria-label="파티 필터"
        ></div>
      </section>
      <p id="boardStatus" class="muted" role="status"></p>
      <div id="board"></div>
      <p class="notice" id="warning" role="alert" hidden></p>
      <footer>
        목요일 00:00 주간 초기화 · 매월 1일 00:00 월간 초기화 (KST) · 브라우저에
        저장 <span>Data based on NEXON Open API</span>
      </footer>
    </main>
    <dialog id="characterDialog" aria-labelledby="characterTitle">
      <form id="add">
        <h2 id="characterTitle">캐릭터 추가</h2>
        <label
          >캐릭터 이름<input
            id="nickname"
            maxlength="12"
            placeholder="닉네임 입력"
            autocomplete="off"
            required
        /></label>
        <p id="lookupMsg" role="status" class="muted"></p>
        <div class="actions">
          <button type="button" data-close>닫기</button>
          <button id="manual" type="button">이름으로 직접 추가</button>
          <button id="lookup" class="primary">조회하고 추가</button>
        </div>
      </form>
    </dialog>
    <dialog id="bulkDialog" aria-labelledby="bulkTitle">
      <div class="bulk-layout">
        <header class="dialog-head bulk-head">
          <h2 id="bulkTitle">보스 일괄 편집</h2>
          <button id="closeBulk" type="button">닫기</button>
        </header>
        <div class="bulk-scope">
          <label>편집할 캐릭터<select id="bulkSource"></select></label>
          <label
            >표에 표시<select id="bulkFilter">
              <option value="all">전체 보스</option>
              <option value="included">가는 보스만</option>
            </select></label
          >
          <button id="bulkNewSquad" type="button">+ 새 파티</button>
        </div>
        <div class="bulk-controls">
          <div class="bulk-selection">
            <strong id="bulkMarked" aria-live="polite"></strong>
            <button id="markIncluded" type="button">가는 보스 체크</button>
            <button id="clearMarks" type="button">체크 해제</button>
          </div>
          <div class="bulk-fields">
            <label
              >난이도<select id="massLevel">
                <option value="">유지</option>
                <option>이지</option>
                <option>노멀</option>
                <option>하드</option>
                <option>카오스</option>
                <option>익스트림</option>
              </select></label
            >
            <label>파티<select id="massSquad"></select></label>
            <label>인원<select id="massSize"></select></label>
            <button id="applyMass" type="button">체크한 보스에 적용</button>
            <button id="excludeMass" type="button">체크한 보스 빼기</button>
          </div>
          <p class="muted" id="bulkMessage" role="status"></p>
        </div>
        <div class="bulk-workspace">
          <div class="bulk-scroll" tabindex="0" aria-label="보스 설정 목록">
            <table class="bulk-table">
              <thead>
                <tr>
                  <th scope="col">
                    <input
                      type="checkbox"
                      id="markAll"
                      aria-label="표에 보이는 보스 전부 체크"
                    />
                  </th>
                  <th scope="col">보스</th>
                  <th scope="col">가기</th>
                  <th scope="col">난이도</th>
                  <th scope="col">파티</th>
                  <th scope="col">인원</th>
                  <th scope="col">내 몫</th>
                </tr>
              </thead>
              <tbody id="bulkRows"></tbody>
            </table>
          </div>
          <details id="bulkCopy">
            <summary id="copySummary">다른 캐릭터에도 복사</summary>
            <div class="copy-body">
              <div class="copy-head">
                <label
                  >복사 범위<select id="copyMode">
                    <option value="merge">
                      가는 보스 추가 · 기존 목록 유지
                    </option>
                    <option value="marked">체크한 보스만 맞추기</option>
                    <option value="replace">보스 목록 전체 맞추기</option>
                  </select></label
                >
                <button id="copyAll" type="button">
                  다른 캐릭터 전부 선택
                </button>
              </div>
              <div id="copyTargets" class="copy-targets"></div>
              <p class="muted">
                보스·난이도·파티·인원을 복사합니다. 각 캐릭터의 격파 기록과
                메모는 유지됩니다.
              </p>
            </div>
          </details>
        </div>
        <div class="bulk-footer">
          <span id="bulkTotals" class="muted" aria-live="polite"></span>
          <div class="actions">
            <button id="saveNext" type="button">저장 후 다음 캐릭터</button>
            <button id="saveBulk" class="primary" type="button">저장</button>
          </div>
        </div>
      </div>
    </dialog>
    <dialog id="raidDialog" aria-labelledby="raidTitle">
      <form id="raidForm">
        <h2 id="raidTitle">보스 설정</h2>
        <div class="pair">
          <label>난이도<select id="level"></select></label>
          <label>참가 인원<select id="players"></select></label>
        </div>
        <label>같이 가는 파티<select id="squadSelect"></select></label>
        <label id="newSquadField" hidden
          >새 파티 이름<input
            id="newSquadName"
            maxlength="32"
            placeholder="예: 토요일 밤 파티"
        /></label>
        <label
          >메모<input id="raidNote" maxlength="100" placeholder="요일, 시간 등"
        /></label>
        <p class="raid-preview" id="raidPreview"></p>
        <div class="actions">
          <button type="button" data-close>취소</button
          ><button class="primary">배정 저장</button>
        </div>
      </form>
    </dialog>
    <dialog id="squadDialog" aria-labelledby="squadTitle">
      <form id="squadForm">
        <h2 id="squadTitle">파티 추가</h2>
        <div class="pair">
          <label
            >파티 이름<input
              id="squadName"
              maxlength="32"
              required
              placeholder="예: 토요일 밤 파티"
          /></label>
          <label>기본 인원<select id="squadSize"></select></label>
        </div>
        <label
          >파티원·시간 메모<input
            id="squadNote"
            maxlength="100"
            placeholder="예: 비숍님, 토요일 21시"
        /></label>
        <fieldset class="palette-field">
          <legend>파티 색</legend>
          <div class="palette-controls">
            <div
              id="partyPalette"
              class="swatches"
              aria-label="추천 파티 색"
            ></div>
            <label class="custom-color"
              >직접 지정<input id="squadColor" type="color" value="#b6a0ff"
            /></label>
          </div>
          <div id="colorPreview" class="color-preview">
            보스 목록에서 보이는 색
          </div>
        </fieldset>
        <div class="actions">
          <button type="button" id="removeSquad" class="danger" hidden>
            파티 삭제
          </button>
          <button type="button" data-close>취소</button
          ><button class="primary">파티 저장</button>
        </div>
      </form>
    </dialog>
    <dialog id="pricesDialog" class="wide" aria-labelledby="pricesTitle">
      <div class="dialog-head">
        <h2 id="pricesTitle">결정석 가격표</h2>
        <button type="button" data-close>닫기</button>
      </div>
      <p class="muted" id="priceExplanation"></p>
      <div
        class="table-scroll"
        tabindex="0"
        aria-label="인원별 결정석 가격표 스크롤"
      >
        <table id="priceTable"></table>
      </div>
      <p class="sources">
        <a
          href="https://maplestory.nexon.com/News/Update/813"
          target="_blank"
          rel="noopener"
          >9월 가격 공지</a
        ><a
          href="https://maplestory.nexon.com/News/Update/815"
          target="_blank"
          rel="noopener"
          >10월 가격 공지</a
        ><a
          href="https://maplescanner.com/boss/crystal"
          target="_blank"
          rel="noopener"
          >가격 대조표</a
        >
      </p>
    </dialog>
    <noscript
      >단풍수첩을 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript
    >
  </body>
</html>
