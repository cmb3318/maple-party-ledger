<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f6f1" />
    <meta
      name="description"
      content="캐릭터별 메이플스토리 보스 파티와 격파 기록을 관리하는 주간 원정 수첩"
    />
    <title>단풍수첩 · 메이플 보스 파티 체크리스트</title>
    <link rel="icon" type="image/png" href="/leaf.png" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <div class="shell mast">
        <a class="brand" href="/"
          ><img src="/leaf.png" width="30" height="30" alt="" />단풍수첩</a
        ><span>메이플스토리 보스 기록</span>
      </div>
    </header>
    <main class="shell">
      <section class="hero">
        <div>
          <span class="eyebrow">PARTY JOURNAL</span>
          <h1>보스 원정 수첩</h1>
          <p>캐릭터별 파티와 격파 기록을 한곳에.</p>
          <div class="date" id="week"></div>
        </div>
        <img src="/summit.png" alt="" class="scene" />
      </section>
      <div class="columns">
        <aside class="card">
          <div class="card-head">
            <h2>내 캐릭터</h2>
            <span id="charCount" class="count">0</span>
          </div>
          <div id="roster"></div>
          <form id="add">
            <label for="nickname">캐릭터 이름</label
            ><input
              id="nickname"
              maxlength="12"
              placeholder="닉네임 입력"
              autocomplete="off"
              required
            /><button id="lookup" class="primary">조회하고 추가</button
            ><button id="manual" type="button" class="quiet">
              이름으로 직접 추가
            </button>
          </form>
          <p id="lookupMsg" role="status"></p>
        </aside>
        <section class="card journal">
          <div class="card-head">
            <div>
              <span class="eyebrow">RAID CHECKLIST</span>
              <h2>보스 체크리스트</h2>
            </div>
            <button id="edit" class="secondary">목록 편집</button>
          </div>
          <div class="tabs" id="cycles" aria-label="기록 주기">
            <button data-cycle="weekly" aria-pressed="true">주간 보스</button
            ><button data-cycle="monthly" aria-pressed="false">
              월간 보스
            </button>
          </div>
          <div class="summary">
            <div>
              <strong id="progressText"></strong><span id="reset"></span>
            </div>
            <progress
              id="progress"
              aria-label="격파 진행률"
              max="1"
              value="0"
            ></progress>
          </div>
          <p id="hint"></p>
          <div id="bosses"></div>
        </section>
      </div>
      <p id="warning" role="alert" hidden></p>
      <footer>
        <b>단풍수첩</b
        ><span>이 브라우저에 자동 저장 · Data based on NEXON Open API</span>
      </footer>
    </main>
    <dialog id="editor">
      <form method="dialog">
        <h2>원정 목록 편집</h2>
        <p>이 캐릭터로 갈 보스를 선택하세요.</p>
        <div id="choices"></div>
        <div class="actions">
          <button value="cancel" class="secondary">취소</button
          ><button value="save" class="primary">목록 저장</button>
        </div>
      </form>
    </dialog>
    <noscript
      >체크리스트를 사용하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript
    >
  </body>
</html>
